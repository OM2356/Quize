<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz App</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .quiz-container {
      background: #fff;
      padding: 30px;
      width: 90%;
      max-width: 550px;
      border-radius: 12px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    h1 {
      margin-bottom: 14px;
      color: #333;
    }

    #question {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: 600;
      color: #444;
    }

    #options {
      list-style: none;
      padding: 0;
    }

    #options li {
      background: #f5f5f5;
      margin: 12px 0;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    #options li:hover {
      background: #eef3ff;
      transform: scale(1.02);
      border: 2px solid #2575fc;
    }

    #options li.selected {
      background: #d9e9ff;
      border: 2px solid #2575fc;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2575fc;
      color: white;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: #1a5fd1;
      transform: scale(1.05);
    }

    #result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    #score {
      margin-top: 20px;
      font-weight: bold;
      font-size: 18px;
      color: #333;
    }

    /* Progress bar */
    .progress-bar {
      width: 100%;
      background: #eee;
      border-radius: 10px;
      margin-top: 20px;
      overflow: hidden;
      height: 12px;
    }
    .progress {
      height: 100%;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      width: 0%;
      transition: width 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1>🚀 Quiz Time!</h1>
    <div id="question">Question text</div>
    <ul id="options"></ul>
    <button id="submitBtn" onclick="submitAnswer()">Submit</button>
    <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next</button>
    <div id="result"></div>
    <div id="score">Score: 0</div>
    <div class="progress-bar"><div class="progress" id="progress"></div></div>
  </div>

  <script>
    const questions = [
      {
        question: "Time complexity to access an array element by index ?",
        options: ["O(n)","O(log n)","O(1)","O(n2)"],
        answer: "O(1)"
      },
      {
        question: "Java Arrays are stored in",
        options: ["Random memory","Contiguous memory","Stack only","Heap only"],
        answer: "Contiguous memory"
      },
      {
        question: "Binary search works only when array is ",
        options: ["Large","Small","Sorted","Unsorted"],
        answer: "Sorted"
      },
      {
        question: "Worst case time complexity of linear search ",
        options: ["O(1)","O(log n)","O(n)","O(n log n)"],
        answer: "O(n)"
      },
      {
        question: "Best case time complexity of Bubble Sort ",
        options: ["O(n2)","O(n log n)","O(n)","O(log n)"],
        answer: "O(n)"
      },
      {
        question:"Which sorting algorithm is NOT comparison based",
        options:["Quick Sort","Merge Sort","Heap Sort","Counting  Sort"],
        answer:"Counting  Sort"
      },
      {
        question:"Stack follows which principle ?",
        options:["FIFO","LIFO","LILO","FILO"],
        answer:"LIFO"
      },
      {
        question:"Push and Pop operations take ",
        options:["O(n)","O(log n)","O(1)","O(n2)"],
        answer:"O(1)" 
      },
      {
        question:"Queue follows",
        options:["LIFO","FIFO","FILO","Random"],
        answer:"FIFO"
      },
      {
        question:"Which is a circular queue advantage",
        options:["Wastes memory","Overflow problem","Better memory utilization","Slower"],
        answer:"Better memory utilization"
      },
      {
        question:"Which linked list allows traversal both ways ?",
        options:["Singly","Circular","Doubly","Liner"],
        answer:"Doubly"  
      },
      {
        question:"Maximum children of a binary tree node ?",
        options:["1","2","3","Unlimited"],
        answer:"2"
      },
      {
        question:"Inorder traversal of BST gives ",
        options:["Random order","Descending order","Sorted order","Level order"],
        answer:"Sorted order"
      },
      {
        question:"What is the output of print (2**3**2)?",
        options:["64","512","256","729"],
        answer:"512"
      },
      {
        question:"BSt properly ",
        options:["Left>Root>Right","Left<Root<Right","Random","No order"],
        answer:"Left<Root<Right"
      },
      {
        question:"Max heap property ",
        options:["Parent<=Children","Parent>=Children","Random","No rule"],
        answer:"Compilation"
      },
      {
        question:"Heap is used in",
        options:["BFS","DFS","Heap Sort","Linear Search"],
        answer:"Heap Sort"
      },
      {
        question:"BFS Uses",
        options:["Stack","Queue","Recursion","Tree"],
        answer:"Queue"
      },
      {
        question:"DFS Uses",
        options:["Stack","Queue","Array","Heap"],
        answer:"Stack"
      },
      {
        question:"Average time complexity of search in Hash Table ",
        options:["O(n)","O(log n)","O(1)","O(n2)"],
        answer:"O(1)"
      },
      {
        question:"Base condition is required to ",
        options:["Speed up","Stop infinite calls","Reduce memory","Increase Stack"],
        answer:"Stop infinite calls"
      },
      {
        question:"Which is better complexity ? ",
        options:["O(n2)","O(n log n)","O(n)","O(1)"],
        answer:"O(1)"
      },
      
    ];

    let currentIndex = 0;
    let score = 0;
    let selectedOption = null;

    function showQuestion() {
      const current = questions[currentIndex];
      document.getElementById("question").innerText = current.question;
      const optionsList = document.getElementById("options");
      optionsList.innerHTML = "";
      document.getElementById("result").innerText = "";
      selectedOption = null;

      current.options.forEach(option => {
        const li = document.createElement("li");
        li.innerText = option;
        li.onclick = function () {
          selectOption(this);
        };
        optionsList.appendChild(li);
      });

      document.getElementById("submitBtn").style.display = "inline-block";
      document.getElementById("nextBtn").style.display = "none";

      updateProgress();
    }

    function selectOption(option) {
      const options = document.querySelectorAll("#options li");
      options.forEach(o => o.classList.remove("selected"));
      option.classList.add("selected");
      selectedOption = option;
    }

    function submitAnswer() {
      if (!selectedOption) {
        alert("⚠️ Please select an option!");
        return;
      }

      const answer = questions[currentIndex].answer;
      if (selectedOption.innerText === answer) {
        score++;
        selectedOption.style.backgroundColor = "lightgreen";
        document.getElementById("result").innerText = "✅ Correct!";
        document.getElementById("result").style.color = "green";
      } else {
        selectedOption.style.backgroundColor = "salmon";
        document.getElementById("result").innerText = `❌ Wrong! Correct Answer: ${answer}`;
        document.getElementById("result").style.color = "red";
      }
      document.getElementById("score").innerText = `Score: ${score}`;
      document.getElementById("submitBtn").style.display = "none";
      document.getElementById("nextBtn").style.display = "inline-block";
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) {
        showQuestion();
      } else {
        document.getElementById("question").innerText = "🎉 Quiz Completed!";
        document.getElementById("options").innerHTML = "";
        document.getElementById("submitBtn").style.display = "none";
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("result").innerText = `Final Score: ${score}/${questions.length}`;
        document.getElementById("result").style.color = "blue";
        document.getElementById("progress").style.width = "100%";
      }
    }

    function updateProgress() {
      const progress = document.getElementById("progress");
      progress.style.width = ((currentIndex) / questions.length) * 10 + "%";
    }

    // Initialize
    showQuestion();
  </script>
</body>
</html>
